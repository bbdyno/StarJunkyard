name: Validate shared contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release-ready content, pixel assets, and golden fixtures
        run: python3 tools/validate_project.py --release
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
